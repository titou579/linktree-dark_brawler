<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dark_Brawler - Mes Liens</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background: linear-gradient(135deg, #0f0c20 0%, #1a103c 100%);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 480px;
      text-align: center;
      background: rgba(255, 255, 255, 0.05);
      padding: 30px 20px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: #7289da;
      margin: 0 auto 15px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      font-weight: bold;
      box-shadow: 0 4px 15px rgba(114, 137, 218, 0.4);
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 5px;
      letter-spacing: 0.5px;
    }
    p.subtitle {
      font-size: 0.9rem;
      color: #a0a0b0;
      margin-bottom: 25px;
    }
    .links {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .link-card {
      display: block;
      padding: 16px 20px;
      border-radius: 12px;
      text-decoration: none;
      color: #fff;
      font-weight: 600;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .link-card:hover {
      transform: translateY(-2px);
    }
    .youtube {
      background: #ff0000;
      box-shadow: 0 4px 15px rgba(255, 0, 0, 0.3);
    }
    .discord {
      background: #5865f2;
      box-shadow: 0 4px 15px rgba(88, 101, 242, 0.3);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="avatar">DB</div>
    <h1>dark_brawler</h1>
    <p class="subtitle">Bienvenue sur mes réseaux officiels !</p>
    
    <div class="links">
      <a href="https://www.youtube.com/@Dark_brawler3" target="_blank" class="link-card youtube">
        📺 Chaîne YouTube
      </a>
      <a href="https://discord.gg/EXumWnw4Ew" target="_blank" class="link-card discord">
        💬 Serveur Discord
      </a>
    </div>
  </div>
</body>
</html>
